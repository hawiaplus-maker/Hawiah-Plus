  flutter_test:
    sdk: flutter
  hive_generator: ^2.0.1
  build_runner: ^2.4.11
flutter_launcher_icons:
  android: "launcher_icon"
  ios: true
  image_path: "assets/images/newAppLogoImage.png"
  min_sdk_android: 21
  remove_alpha_ios: true

flutter:
  # Use Material Design icons
  uses-material-design: true

  assets:
    - assets/
    - assets/images/
    - assets/icons/
    - assets/translations/
    - assets/gifs/
    - assets/global_icon/
    - assets/svg/
  fonts:
    - family: DINNextLTArabic
      fonts:
        - asset: assets/font/DINNextLTArabic-Medium-4.ttf
          weight: 500
        - asset: assets/font/DINNextLTArabic-Bold-2.ttf
          weight: 700

flutter_native_splash:
  image: "assets/images/newAppLogoImage.png"
  color: "FFFFFF"
  android: true
  ios: true

flutter_lints: ^3.0.0
